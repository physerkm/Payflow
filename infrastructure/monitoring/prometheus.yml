global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: payflow-otel        # API + Worker metrics exported through the collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
  - job_name: rabbitmq            # built-in rabbitmq_prometheus plugin (queue depth, unacked, DLQ size)
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: rabbitmq-queues     # per-queue depth (needed for dead-letter queue size)
    metrics_path: /metrics/detailed
    params: { family: [queue_coarse_metrics] }
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: postgres            # postgres-exporter: sessions, locks, slow queries (pg_stat_statements)
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
